<app-header></app-header>

<div class="admin-login-container">
    <div class="admin-login-form-container">
        <div class="admin-badge">Administration</div>
        <h2>Connexion administrateur</h2>

        <div class="error-banner" *ngIf="errorMessage">
            {{ errorMessage }}
        </div>

        <form (ngSubmit)="onSubmit()" #adminLoginForm="ngForm" novalidate>
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    [(ngModel)]="email"
                    required
                    autocomplete="email"
                    [disabled]="isLoading"
                />
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    [(ngModel)]="password"
                    required
                    autocomplete="current-password"
                    [disabled]="isLoading"
                />
            </div>
            <button
                type="submit"
                [disabled]="isLoading || adminLoginForm.invalid"
            >
                {{ isLoading ? 'Connexion en cours...' : 'Se connecter' }}
            </button>
        </form>
    </div>
</div>
